name: Validate MomentumFlow static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate embedded JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!/<title>MomentumFlow/.test(html)) throw new Error('Page title missing');
          if (!/<div class="app">/.test(html)) throw new Error('Application shell missing');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline application script found');
          for (const [, source] of scripts) new Function(source);
          console.log(`Validated ${scripts.length} inline script(s) in index.html`);
          NODE
      - name: Verify static Pages entrypoint
        run: |
          test -s index.html
          test -f .nojekyll
          echo "Static GitHub Pages entrypoint and .nojekyll are present."
