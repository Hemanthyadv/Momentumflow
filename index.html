<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101323"><title>MomentumFlow — Focus with momentum</title><meta name="description" content="A focused productivity command center for goals, batches and real active time."><style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#151b2e;--panel2:#202943;--text:#eff2ff;--muted:#9aa7c3;--line:#2b3550;--blue:#8298ff;--violet:#ad91ff;--green:#49d6a1;--gold:#f6c66b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#202b50,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}body.light{color-scheme:light;--bg:#f3f5fb;--panel:#fff;--panel2:#f6f7fc;--text:#18213a;--muted:#68738d;--line:#e0e5f1;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8298ff88}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:24px 15px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:25px;background:var(--bg)}.brand{font-size:20px;font-weight:850;padding:5px 10px}.brand span{display:inline-grid;place-items:center;background:linear-gradient(135deg,#8298ff,#ad91ff);border-radius:12px;width:38px;height:38px;margin-right:8px}.nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin:4px 0;border:0;border-radius:11px;background:transparent;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.sidebottom{margin-top:auto}.profile{border-top:1px solid var(--line);padding:15px 8px;color:var(--muted)}main{max-width:1500px;width:100%;padding:28px clamp(15px,3vw,42px);margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:5px 0;font-weight:850}.muted{color:var(--muted)}.tiny{font-size:12px}.grid{display:grid;gap:16px}.hero{grid-template-columns:1.4fr 1fr}.stats{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{padding:21px;border:1px solid var(--line);background:var(--panel);border-radius:18px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head strong{font-size:16px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:700}.primary{border:0;color:white;background:linear-gradient(120deg,#7794ff,#947cf5)}.stat{display:flex;align-items:center;gap:12px}.symbol{width:40px;height:40px;display:grid;place-items:center;background:#8298ff20;border-radius:13px;font-size:19px}.stat strong{font-size:23px;display:block}.stat small{color:var(--muted)}.goal{display:grid;grid-template-columns:145px 1fr;gap:22px;align-items:center}.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--pct,0%),var(--line) 0);position:relative}.ring:before{content:"";position:absolute;inset:10px;background:var(--panel);border-radius:50%}.ring div{position:relative;text-align:center}.ring b{font-size:28px;display:block}.big{font-size:38px;font-weight:850;letter-spacing:-1px}.progress{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet))}.metrics{display:flex;gap:18px;flex-wrap:wrap;margin-top:15px}.metrics div{flex:1;min-width:70px}.metrics b{display:block;font-size:17px}.metrics small{color:var(--muted);font-size:11px}.timer{font-size:48px;font-weight:850;font-variant-numeric:tabular-nums;margin:12px 0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}.projectgrid{grid-template-columns:repeat(3,1fr)}.project{border-top:3px solid var(--accent)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;color:var(--muted);text-transform:uppercase}.bars{height:150px;display:flex;align-items:end;gap:10px}.barcol{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:linear-gradient(var(--violet),var(--blue));border-radius:7px 7px 2px 2px;margin:6px 0;min-height:3px}.badge{background:#8298ff20;color:var(--blue);padding:4px 8px;border-radius:7px;font-size:11px}.section{margin-top:18px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.notice{position:fixed;bottom:20px;right:20px;padding:14px 18px;background:var(--panel);border:1px solid var(--blue);border-radius:12px;box-shadow:0 15px 40px #0004;z-index:10}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:950px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.projectgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto;margin:0}.sidebottom{display:none}main{padding:18px 12px}h1{font-size:26px}.goal{grid-template-columns:95px 1fr;gap:12px}.ring{width:92px;height:92px}.ring:before{inset:7px}.ring b{font-size:21px}.card{padding:15px}.projectgrid{grid-template-columns:1fr}.timer{font-size:38px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="app"><aside><div class="brand"><span>✦</span>MomentumFlow</div><nav class="nav" id="nav"><button class="active" data-page="Dashboard">⌂ Dashboard</button><button data-page="Projects">▦ Projects</button><button data-page="Focus Session">◷ Focus Session</button><button data-page="Batch History">☷ Batch History</button><button data-page="Analytics">⌁ Analytics</button><button data-page="Achievements">♜ Achievements</button><button data-page="Daily Reports">▤ Daily Reports</button><button data-page="Settings">⚙ Settings</button></nav><div class="sidebottom profile"><b id="person">Hemanth</b><br><span id="level">Level 1 · 0 XP</span></div></aside><main><header class="top"><div><div class="eyebrow" id="date"></div><h1 id="title">Your command center</h1><div class="muted" id="subtitle">Small batches. Real progress. Sustainable momentum.</div></div><div><button class="btn" onclick="theme()">◐</button> <button class="btn primary" onclick="start()">＋ Start session</button></div></header><section id="view"></section><p class="muted tiny" style="text-align:center;margin-top:25px">Stored privately in this browser · Export backups in Settings</p></main></div><div id="toast"></div><script>
(function(){'use strict';var KEY='momentumflow-production-v1';function day(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function base(){return {v:1,name:'Hemanth',theme:'dark',active:'v',projects:[{id:'v',name:'Video annotation',cat:'AI Operations',color:'#8b86ff',target:800,batch:100},{id:'a',name:'Audio annotation',cat:'AI Operations',color:'#4fd1d0',target:500,batch:100},{id:'c',name:'Coding & research',cat:'Development',color:'#f6c66b',target:3,batch:1}],batches:[],session:null,goals:{},xp:0,notes:{}}}var s;try{s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s||s.v!==1||!Array.isArray(s.projects)||!Array.isArray(s.batches))s=base()}catch(e){s=base()}var page='Dashboard',tick=null;function save(){localStorage.setItem(KEY,JSON.stringify(s))}function msg(t){var e=document.getElementById('toast');e.innerHTML='<div class="notice">'+t+'</div>';setTimeout(function(){e.innerHTML=''},3000)}function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fmt(n){n=Math.max(0,Math.floor(n||0));var h=Math.floor(n/3600),m=Math.floor(n%3600/60),ss=n%60;return h?h+'h '+('0'+m).slice(-2)+'m':('0'+m).slice(-2)+':'+('0'+ss).slice(-2)}function project(pid){for(var i=0;i<s.projects.length;i++)if(s.projects[i].id===(pid||s.active))return s.projects[i];return s.projects[0]}function goal(){return s.goals[s.active+':'+day()]||{target:project().target,batch:project().batch,minutes:240}}function records(pid,dt){return s.batches.filter(function(b){return b.project=== (pid||s.active)&&b.date===(dt||day())})}function tasks(pid,dt){return records(pid,dt).reduce(function(a,b){return a+b.tasks},0)}function elapsed(){var x=s.session;if(!x)return 0;return x.active+(x.since?Math.floor((Date.now()-x.since)/1000):0)}function rate(){var r=records(),sec=r.reduce(function(a,b){return a+b.active},0);return sec?tasks()/(sec/3600):0}function xp(){return s.xp||0}function head(t,r){return '<div class="head"><strong>'+t+'</strong>'+(r||'')+'</div>'}function stat(i,v,l){return '<div class="card stat"><div class="symbol">'+i+'</div><div><strong>'+v+'</strong><small>'+l+'</small></div></div>'}function btn(t,fn,primary){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+fn+'">'+t+'</button>'}function dash(){var g=goal(),n=tasks(),pct=g.target?n/g.target*100:0,rem=Math.max(0,g.target-n),bs=records(),sec=bs.reduce(function(a,b){return a+b.active},0),r=rate(),week=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);week.push({d:k,n:s.batches.filter(function(b){return b.date===k}).reduce(function(a,b){return a+b.tasks},0)})}var max=Math.max(1,...week.map(function(x){return x.n}));return '<div class="grid hero"><div class="card">'+head('DAILY GOAL COMMAND CENTER',btn('✎ Edit goal','editGoal()'))+'<h2>'+esc(project().name)+'</h2><div class="muted tiny">'+(pct>=100?'Target achieved':pct>=50?'Halfway there':n?'Building momentum':'Not started')+'</div><div class="goal" style="margin-top:20px"><div class="ring" style="--pct:'+Math.min(100,pct)+'%"><div><b>'+Math.round(pct)+'%</b><span class="tiny muted">GOAL</span></div></div><div><div class="eyebrow">TASKS COMPLETED</div><div class="big">'+n+' <span class="muted" style="font-size:18px">/ '+g.target+'</span></div><div class="progress"><span style="width:'+Math.min(100,pct)+'%"></span></div><div class="muted tiny">'+rem+' tasks remaining</div><div class="metrics"><div><b>'+fmt(sec)+'</b><small>Active today</small></div><div><b>'+(r?Math.round(r):'—')+'</b><small>Tasks/hour</small></div><div><b>'+(r&&rem?fmt(rem/r*3600):rem?'—':'Done')+'</b><small>Est. remaining</small></div></div></div></div></div><div class="card">'+head('FOCUS SESSION','<span class="badge">'+(s.session?s.session.state:'Ready')+'</span>')+'<div class="muted">'+(s.session?esc(project(s.session.project).name):'Ready when you are')+'</div><div class="timer" id="timer">'+(s.session?fmt(elapsed()):'00:00')+'</div><p class="muted tiny">'+(s.session?'Actual tasks: '+s.session.tasks+' · Batch target: '+s.session.batch:'Start a batch and track your real active time.')+'</p>'+btn(s.session?(s.session.state==='running'?'Ⅱ Pause':'▶ Resume'):'▶ Start first batch',s.session?(s.session.state==='running'?'pause()':'resume()'):'start()',true)+' '+(s.session?btn('Finish & save','finish()'):btn('Edit goal','editGoal()'))+'</div></div><div class="grid stats">'+stat('▦',s.batches.length,'Batches recorded')+stat('◷',fmt(s.batches.reduce(function(a,b){return a+b.active},0)),'Total active time')+stat('↗',Math.round(s.batches.reduce(function(a,b){return a+b.tasks},0)/(s.batches.reduce(function(a,b){return a+b.active},0)||1)*3600),'Overall tasks/hour')+stat('✦','Level '+(Math.floor(xp()/250)+1),xp()+' XP earned')+'</div><div class="grid hero section"><div class="card">'+head('Weekly activity','<span class="badge">7 days</span>')+'<div class="bars">'+week.map(function(x){return '<div class="barcol">'+(x.n||'—')+'<div class="bar" style="height:'+Math.max(3,x.n/max*100)+'px"></div>'+x.d.slice(5)+'</div>'}).join('')+'</div><p class="muted tiny">Only recorded work is shown.</p></div><div class="card">'+head('Recent batches',btn('View all →',"go('Batch History')"))+(s.batches.length?s.batches.slice(0,4).map(function(b){return '<div class="row"><div><b>'+esc(project(b.project).name)+'</b><div class="muted tiny">'+b.date+' · '+fmt(b.active)+'</div></div><b>+'+b.tasks+'</b></div>'}).join(''):'<div class="empty">No batches yet. Start your first focus session.</div>')+'</div></div>'}
function projects(){return '<div class="card">'+head('Your projects',btn('＋ New project','newProject()',true))+'<div class="grid projectgrid">'+s.projects.map(function(p){return '<div class="card project" style="--accent:'+p.color+'"><span class="badge">'+esc(p.cat)+'</span><h3>'+esc(p.name)+'</h3><p class="muted tiny">Today: '+tasks(p.id)+' / '+p.target+' tasks</p><div class="progress"><span style="width:'+Math.min(100,p.target?tasks(p.id)/p.target*100:0)+'%"></span></div>'+btn(s.active===p.id?'Selected':'Switch to project',"selectProject('"+p.id+"')",s.active!==p.id)+' '+btn('Archive',"archiveProject('"+p.id+"')")+'</div>'}).join('')+'</div></div>'}
function focus(){var x=s.session;return '<div class="grid hero"><div class="card">'+head('LIVE WORK PANEL')+'<h2>'+(x?esc(project(x.project).name):'Ready for your next batch?')+'</h2><div class="timer" id="timer">'+(x?fmt(elapsed()):'00:00')+'</div><p class="muted">Active time excludes paused time. Breaks are for sustainable work.</p>'+(x?'<div class="field"><label>Actual tasks completed</label><input id="actual" type="number" min="0" value="'+x.tasks+'"></div><div class="field"><label>Batch note</label><input id="note" value="'+esc(x.note||'')+'"></div>'+btn(x.state==='running'?'Ⅱ Pause':'▶ Resume',x.state==='running'?'pause()':'resume()',true)+' '+btn('☕ Break','pause()')+' '+btn('Finish & save','finish()')+' '+btn('Cancel','cancel()'):'<div class="field"><label>Batch size</label><input id="batch" type="number" min="1" value="'+goal().batch+'"></div>'+btn('Start batch','start()',true))+'</div><div class="card">'+head('Daily progress')+'<div class="big">'+tasks()+' / '+goal().target+'</div><div class="progress"><span style="width:'+Math.min(100,goal().target?tasks()/goal().target*100:0)+'%"></span></div><p class="muted tiny">Save actual task counts, even when a batch is partial.</p></div></div>'}
function history(){return '<div class="card">'+head('Batch history','<span class="badge">'+s.batches.length+' records</span>')+(s.batches.length?'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Project</th><th>Tasks</th><th>Planned</th><th>Active</th><th>Status</th><th></th></tr></thead><tbody>'+s.batches.map(function(b){return '<tr><td>'+b.date+'</td><td>'+esc(project(b.project).name)+'</td><td>'+b.tasks+'</td><td>'+b.batch+'</td><td>'+fmt(b.active)+'</td><td><span class="badge">'+b.status+'</span></td><td><button class="btn" onclick="delBatch(\\''+b.id+'\\')">Delete</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Your saved batches will appear here.</div>')+'</div>'}
function analytics(){return '<div class="grid stats">'+stat('▦',s.batches.reduce(function(a,b){return a+b.tasks},0),'Tasks recorded')+stat('◷',fmt(s.batches.reduce(function(a,b){return a+b.active},0)),'Active time')+stat('↗',s.batches.length?Math.round(s.batches.reduce(function(a,b){return a+b.tasks},0)/(s.batches.reduce(function(a,b){return a+b.active},0)||1)*3600):'—','Tasks/hour')+stat('✦',xp(),'XP earned')+'</div><div class="card">'+head('Project comparison')+s.projects.map(function(p){var n=s.batches.filter(function(b){return b.project===p.id}).reduce(function(a,b){return a+b.tasks},0);return '<div class="row"><b>'+esc(p.name)+'</b><span>'+n+' tasks</span></div>'}).join('')+'</div>'}
function achievements(){var n=s.batches.reduce(function(a,b){return a+b.tasks},0),defs=[['First batch',s.batches.length>0],['100 tasks',n>=100],['500 tasks',n>=500],['Daily target',tasks()>=goal().target],['Five batches',s.batches.length>=5],['Work on 3 days',new Set(s.batches.map(function(b){return b.date})).size>=3]];return '<div class="card"><h2>Level '+(Math.floor(xp()/250)+1)+'</h2><p class="muted">'+xp()+' XP · '+(xp()%250)+' / 250 XP to next level</p><div class="progress"><span style="width:'+(xp()%250/250*100)+'%"></span></div></div><div class="grid projectgrid section">'+defs.map(function(d){return '<div class="card"><h3 style="color:'+(d[1]?'var(--green)':'var(--muted)')+'">'+(d[1]?'✦ ':'○ ')+d[0]+'</h3><span class="muted tiny">'+(d[1]?'Unlocked':'Locked · based on real work')+'</span></div>'}).join('')+'</div>'}
function reports(){return '<div class="grid hero"><div class="card">'+head('Today’s report',btn('Download report','downloadReport()'))+'<div class="report">Date: '+day()+'\\nProject: '+esc(project().name)+'\\nTarget: '+goal().target+'\\nCompleted: '+tasks()+'\\nRemaining: '+Math.max(0,goal().target-tasks())+'\\nActive time: '+fmt(records().reduce(function(a,b){return a+b.active},0))+'\\nBatches: '+records().length+'</div></div><div class="card">'+head('Daily reflection')+'<div class="field"><label>What went well?</label><input id="went" value="'+esc((s.notes[day()]||{}).went||'')+'"></div><div class="field"><label>What will you improve?</label><input id="improve" value="'+esc((s.notes[day()]||{}).improve||'')+'"></div>'+btn('Save reflection','saveReflection()',true)+'</div></div>'}
function settings(){return '<div class="grid hero"><div class="card">'+head('Personal settings')+'<div class="field"><label>Display name</label><input id="name" value="'+esc(s.name)+'"></div><div class="field"><label>Theme</label><select id="themeSelect"><option value="dark">Dark</option><option value="light">Light</option></select></div>'+btn('Save settings','saveSettings()',true)+'</div><div class="card">'+head('Data & privacy')+'<p class="muted tiny">Your data is stored only in this browser. Export backups regularly; there is no cloud sync.</p>'+btn('↓ Export JSON backup','exportData()',true)+' <label class="btn">Import backup<input type="file" accept=".json,application/json" onchange="importData(this)" hidden></label><div class="section">'+btn('Reset local data','resetData()')+'</div></div></div>'}
function render(){document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();document.getElementById('title').textContent=({'Dashboard':'Your command center','Projects':'My projects','Focus Session':'Protect your focus','Batch History':'Every batch tells a story','Analytics':'See your real progress','Achievements':'Consistency over intensity','Daily Reports':'Close the loop','Settings':'Make MomentumFlow yours'})[page];document.getElementById('subtitle').textContent='Small batches. Real progress. Sustainable momentum.';document.getElementById('person').textContent=s.name;document.getElementById('level').textContent='Level '+(Math.floor(xp()/250)+1)+' · '+xp()+' XP';document.body.classList.toggle('light',s.theme==='light');document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});var views={Dashboard:dash,Projects:projects,'Focus Session':focus,'Batch History':history,Analytics:analytics,Achievements:achievements,'Daily Reports':reports,Settings:settings};document.getElementById('view').innerHTML=views[page]();if(s.session&&!tick)tick=setInterval(function(){var e=document.getElementById('timer');if(e)e.textContent=fmt(elapsed())},1000);if(!s.session&&tick){clearInterval(tick);tick=null}}
function go(p){page=p;render()}function start(){if(s.session){go('Focus Session');return}var n=document.getElementById('batch'),size=n?Number(n.value):goal().batch;if(!Number.isInteger(size)||size<1){msg('Enter a positive batch size.');return}s.session={id:id(),project:s.active,batch:size,tasks:0,started:Date.now(),since:Date.now(),active:0,state:'running',note:''};save();go('Focus Session');msg('Focus started. One batch at a time.')}function pause(){if(!s.session)return;s.session.active=elapsed();s.session.since=0;s.session.state='paused';save();render();msg('Session paused. Take the time you need.')}function resume(){if(!s.session)return;s.session.since=Date.now();s.session.state='running';save();render()}function finish(){var x=s.session;if(!x)return;var inp=document.getElementById('actual'),n=inp?Number(inp.value):x.tasks;if(!Number.isInteger(n)||n<0){msg('Enter a valid actual task count.');return}var note=document.getElementById('note');s.batches.unshift({id:x.id,project:x.project,date:day(),tasks:n,batch:x.batch,active:elapsed(),status:n>=x.batch?'Completed':n?'Partial':'Logged',note:note?note.value:''});if(n)s.xp+=25+Math.floor(n/25);s.session=null;save();render();msg('Saved '+n+' actual tasks.')}function cancel(){if(confirm('Cancel without saving this session?')){s.session=null;save();render()}}function editGoal(){var g=goal(),target=prompt('Daily task target',g.target);if(target===null)return;var batch=prompt('Preferred batch size',g.batch);if(batch===null)return;var minutes=prompt('Planned active minutes',g.minutes||240);if(!Number.isInteger(Number(target))||Number(target)<0||!Number.isInteger(Number(batch))||Number(batch)<1||!Number.isInteger(Number(minutes))||Number(minutes)<1){msg('Please enter valid whole numbers.');return}s.goals[s.active+':'+day()]={target:Number(target),batch:Number(batch),minutes:Number(minutes)};save();render()}function newProject(){var name=prompt('Project name');if(!name||!name.trim())return;var target=Number(prompt('Daily target tasks','500')),batch=Number(prompt('Default batch size','100'));if(!Number.isInteger(target)||target<0||!Number.isInteger(batch)||batch<1){msg('Invalid target or batch size.');return}var p={id:id(),name:name.trim(),cat:'Custom',color:'#8b86ff',target:target,batch:batch};s.projects.push(p);s.active=p.id;save();render()}function selectProject(pid){if(s.session){msg('Finish the active session before switching projects.');return}s.active=pid;save();render()}function archiveProject(pid){if(s.projects.filter(function(p){return !p.archived}).length<2){msg('Keep at least one project active.');return}var p=project(pid);p.archived=!p.archived;if(p.archived&&s.active===pid)s.active=s.projects.find(function(x){return !x.archived}).id;save();render()}function delBatch(bid){if(!confirm('Delete this batch record?'))return;s.batches=s.batches.filter(function(b){return b.id!==bid});save();render()}function theme(){s.theme=s.theme==='dark'?'light':'dark';save();render()}function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='momentumflow-backup-'+day()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(input){var f=input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.v!==1||!Array.isArray(d.projects)||!Array.isArray(d.batches))throw Error();if(confirm('Replace current local data with this backup?')){s=d;save();render()}}catch(e){msg('Invalid backup; current data was kept.')}};r.readAsText(f)}function resetData(){if(confirm('Permanently clear all MomentumFlow data in this browser?')){s=base();save();render()}}function saveSettings(){var n=document.getElementById('name').value.trim();if(!n){msg('Name cannot be empty.');return}s.name=n;s.theme=document.getElementById('themeSelect').value;save();render()}function saveReflection(){s.notes[day()]={went:document.getElementById('went').value,improve:document.getElementById('improve').value};save();msg('Reflection saved.')}function downloadReport(){var text='MomentumFlow report — '+day()+'\\nProject: '+project().name+'\\nTarget: '+goal().target+'\\nCompleted: '+tasks()+'\\nActive time: '+fmt(records().reduce(function(a,b){return a+b.active},0));var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='momentumflow-report-'+day()+'.txt';a.click();URL.revokeObjectURL(a.href)}document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});Object.assign(window,{go,start,pause,resume,finish,cancel,editGoal,newProject,selectProject,archiveProject,delBatch,theme,exportData,importData,resetData,saveSettings,saveReflection,downloadReport});render()})();
</script></body></html>
